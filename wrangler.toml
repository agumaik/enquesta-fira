name = "enquesta-fira"
main = "src/worker.ts"
compatibility_date = "2026-11-09"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "enquesta-fira-db"
database_id = "bf0a6064-459f-46d8-9ee0-319182ac64cf"
migrations_dir = "migrations"

[vars]
SURVEY_OPEN = "true"

# Custom domain: enquesta-fira.agumaik.tech
# After first deploy (and after creating the D1 DB), attach the domain with:
#   wrangler domains add enquesta-fira.agumaik.tech
# or in the Cloudflare dashboard under the Worker → Settings → Domains.
# Uncomment once the zone agumaik.tech is on the same account:
# routes = [
#   { pattern = "enquesta-fira.agumaik.tech", custom_domain = true }
# ]

[observability]
enabled = true

[observability.traces]
enabled = true
