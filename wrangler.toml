name = "enquesta-fira"
main = "src/worker.ts"
compatibility_date = "2026-11-09"
workers_dev = true
routes = [
  { pattern = "enquesta-fira.agumaik.tech", custom_domain = true }
]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/admin/*"]

[[d1_databases]]
binding = "DB"
database_name = "enquesta-fira-db"
database_id = "bf0a6064-459f-46d8-9ee0-319182ac64cf"
migrations_dir = "migrations"

[vars]
SURVEY_OPEN = "true"
TURNSTILE_SITE_KEY = "0x4AAAAAAF5rkgDGzwXjcRm1"

# Secrets (wrangler secret put …): TURNSTILE_SECRET, ACCESS_CODE, ADMIN_PASSWORD

# Daily purge of responses older than 2 years (retention promised in the privacy notice).
[triggers]
crons = ["17 3 * * *"]

[observability]
enabled = true

[observability.traces]
enabled = true
